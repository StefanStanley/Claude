# Databricks Asset Bundle - Job-Definition
#
#   databricks bundle validate
#   databricks bundle deploy -t prod
#
# Der Zeitplan ist bewusst PAUSED. Erst nach ein paar erfolgreichen Testlaeufen
# (dry_run = true) auf UNPAUSED stellen.

bundle:
  name: vde-zugangsverwaltung

resources:
  jobs:
    vde_zugangsabgleich:
      name: VDE-Regelwerkszugaenge Abgleich
      description: >-
        Gleicht die SharePoint-Liste der VDE-Regelwerkszugaenge mit dem
        gefuehrten Ist-Bestand ab und meldet offene Aufgaben per Mail.

      schedule:
        # Montags 07:00 Ortszeit
        quartz_cron_expression: "0 0 7 ? * MON *"
        timezone_id: Europe/Berlin
        pause_status: PAUSED

      max_concurrent_runs: 1

      email_notifications:
        on_failure:
          - ${var.verantwortlicher}
        no_alert_for_skipped_runs: true

      tasks:
        - task_key: abgleich
          notebook_task:
            notebook_path: ../notebooks/vde_zugangsabgleich.py
            base_parameters:
              katalog: ${var.katalog}
              schema: ${var.schema}
              secret_scope: ${var.secret_scope}
              sp_site_hostname: ${var.sp_site_hostname}
              sp_site_pfad: ${var.sp_site_pfad}
              sp_liste: ${var.sp_liste}
              portal_modus: ${var.portal_modus}
              portal_url: ${var.portal_url}
              selektoren_pfad: ${var.selektoren_pfad}
              screenshot_pfad: ${var.screenshot_pfad}
              vorlauf_tage: "30"
              max_entzuege: "10"
              max_aenderungen: "40"
              empfaenger: ${var.verantwortlicher}
              absender: ${var.absender}
              dry_run: "true"
              mail_versand: "aus"

          job_cluster_key: browser_cluster

      # Serverless scheidet aus: der Job braucht Chromium samt System-
      # bibliotheken, und Serverless-Compute laesst weder Init-Scripts noch
      # apt-Installationen zu. Deshalb ein klassischer Job-Cluster.
      job_clusters:
        - job_cluster_key: browser_cluster
          new_cluster:
            spark_version: "15.4.x-scala2.12"     # LTS
            num_workers: 0                        # Single Node reicht vollstaendig
            data_security_mode: SINGLE_USER
            single_user_name: ${var.dienstkonto}
            node_type_id: ${var.node_type}
            custom_tags:
              ResourceClass: SingleNode
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: "local[*]"
            init_scripts:
              - volumes:
                  destination: ${var.init_script_pfad}
            spark_env_vars:
              PLAYWRIGHT_BROWSERS_PATH: /opt/playwright

      queue:
        enabled: true

variables:
  portal_modus:
    description: "aufgabenliste (nur melden) oder browser (ausfuehren)"
    default: aufgabenliste
  portal_url:
    description: Basis-URL der VDE Normenbibliothek
    default: ""
  selektoren_pfad:
    description: JSON mit den Portal-Selektoren im Volume
    default: /Volumes/governance/vde_zugang/konfig/selektoren.json
  screenshot_pfad:
    description: Ablage fuer Fehler-Screenshots
    default: /Volumes/governance/vde_zugang/screenshots
  init_script_pfad:
    description: Init-Script im Volume (stellt Chromium bereit)
    default: /Volumes/governance/vde_zugang/konfig/init_playwright.sh
  node_type:
    description: >-
      Knotentyp. Azure: Standard_DS3_v2 - AWS: m5d.large - GCP: n2-standard-4.
      Der Browser braucht Arbeitsspeicher, unter 14 GB wird es eng.
    default: Standard_DS3_v2
  dienstkonto:
    description: Konto, unter dem der Job laeuft (Single-User-Cluster)
    default: ""
  katalog:
    description: Unity Catalog
    default: governance
  schema:
    description: Schema fuer Bestand und Massnahmen
    default: vde_zugang
  secret_scope:
    description: Databricks Secret Scope mit den Graph-/SMTP-Zugangsdaten
    default: vde-zugang
  sp_site_hostname:
    description: SharePoint-Hostname, z.B. contoso.sharepoint.com
    default: ""
  sp_site_pfad:
    description: Pfad der SharePoint-Site
    default: /sites/Netzbetrieb
  sp_liste:
    description: Name der SharePoint-Liste
    default: VDE-Zugaenge
  verantwortlicher:
    description: Mailadresse des Zugangsverantwortlichen
    default: ""
  absender:
    description: Absender-Postfach beim Graph-Versand
    default: ""

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
