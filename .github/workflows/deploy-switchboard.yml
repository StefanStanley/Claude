name: Deploy SWITCHBOARD (GitHub Pages)

# Deployt den statischen Prototyp aus lovion-switchboard/ auf GitHub Pages.
#
# Hinweis: GitHub Pages (Quelle "GitHub Actions") erlaubt Deployments per
# Default nur vom Default-Branch. Dieser Workflow ist deshalb auf `main`
# ausgelegt und läuft nach dem Merge automatisch. Soll bereits vom
# Feature-Branch deployt werden, unter Settings → Environments →
# github-pages diesen Branch zusätzlich freigeben.
on:
  push:
    branches:
      - main
    paths:
      - "lovion-switchboard/**"
      - ".github/workflows/deploy-switchboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein aktiver Deploy gleichzeitig.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: lovion-switchboard

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
