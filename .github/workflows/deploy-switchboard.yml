name: Deploy SWITCHBOARD (GitHub Pages)

# Deployt den statischen Prototyp aus lovion-switchboard/ auf GitHub Pages.
on:
  push:
    branches:
      - claude/lovion-switchboard-overview-5jkp7i
    paths:
      - "lovion-switchboard/**"
      - ".github/workflows/deploy-switchboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein aktiver Deploy gleichzeitig.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: lovion-switchboard

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
