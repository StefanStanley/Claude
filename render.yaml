# Render Blueprint für die ProzessLupe-App (prozess-interview/).
# Erstellt Web-Service (Docker) + managed PostgreSQL in einem Schritt.
#
# Deploy:  Render Dashboard → "New" → "Blueprint" → dieses Repo wählen.
# Danach unter dem Web-Service ggf. ANTHROPIC_API_KEY setzen und
# LLM_PROVIDER auf "anthropic" ändern (Standard hier: "mock", läuft ohne Key).
#
# Hinweis: Die App wendet Migrationen beim Start selbst an
# (prozess-interview/docker-entrypoint.sh → prisma migrate deploy).

databases:
  - name: prozess-db
    databaseName: prozess
    plan: free # 30-Tage-Testdatenbank; für Dauerbetrieb auf basic-256mb o.ä. hochstufen
    region: frankfurt # EU-Datenhaltung (DSGVO)
    postgresMajorVersion: "16"
    ipAllowList: [] # nur interne Verbindungen (kein öffentlicher Zugriff)

services:
  - type: web
    name: prozess-interview
    runtime: docker
    region: frankfurt
    plan: free # spinnt bei Inaktivität herunter; für Dauerbetrieb: starter
    rootDir: prozess-interview
    # dockerfilePath/dockerContext sind relativ zu rootDir (sonst Pfad-Doppelung).
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: prozess-db
          property: connectionString
      - key: LLM_PROVIDER
        value: anthropic # ohne gesetzten ANTHROPIC_API_KEY faellt die App automatisch auf mock zurueck
      # Groq — kostenloses Free-Tier (zuverlässig); Key aus https://console.groq.com
      - key: GROQ_API_KEY
        sync: false # Wert sicher im Dashboard eintragen (nicht im Repo)
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      # Google Gemini — Free-Tier; Key aus https://aistudio.google.com
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      # Anthropic Claude — kostenpflichtig (optional)
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      # Multimodale Erfassung: Audio-Transkription über Groq Whisper
      # (nutzt GROQ_API_KEY oben, kostenlos). Foto-OCR über das vision-fähige
      # LLM (ANTHROPIC/GEMINI). PDF-Text läuft rein lokal, ohne Key.
      - key: TRANSCRIBE_PROVIDER
        value: groq
      - key: TRANSCRIBE_MODEL
        value: whisper-large-v3-turbo
