# ProzessLupe — On-Prem-Start mit einem Befehl:  docker compose up --build
#
# Ohne ANTHROPIC_API_KEY läuft die App automatisch im Offline-Mock-Modus.
# Für die echte Claude-Extraktion einfach eine .env neben dieser Datei anlegen
# (siehe .env.example) — docker compose liest sie automatisch ein.

services:
  app:
    build:
      context: .
    image: prozess-interview:latest
    container_name: prozess-interview
    ports:
      - "3000:3000"
    environment:
      # Substitution aus .env / Shell; Defaults sorgen für Lauffähigkeit ohne Konfiguration.
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
    restart: unless-stopped

